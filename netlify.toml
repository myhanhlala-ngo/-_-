[build]
  publish   = "public"
  functions = "netlify/functions"
  command   = "echo 'no build step'"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# The page itself must never be served from cache, otherwise users keep an old version
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
