<script id="embedded-data" type="application/json">{"app":"assy-daily-report","v":3,"exportedAt":1793954582553,"state":{"tasks":[{"_id":"legacy_tasks_0"}],"cur":"2026-11-06","savedAt":1793954581571,"pdfs":{},"photos":{},"settings":{"mi2":true,"ship2":true,"plant3":["SM-A576B ASSY CAM DECO","UPPER CAM UW_ASSY","UPPER CAM WIDE_ASSY","SM-F971U ASSY CAM DECO MID","SM-F976U ASSY CAM DECO MID"],"stopRules":["A576 CAM => 3공장","Q8 => 3공장","F971 => 3공장","F976 => 3공장","UPPER CAM => 3공장","A58 => 4공장"],"prodMode":"model","eMin":true,"lang":"vi","view":false,"collapsed":false,"autoHtml":true},"trc":{"ko":{"GH64-102008AA KHÔNG ĐỦ CASE SẢN XUẤT":"GH64-102008AA 케이스 생산 부족","Lệch nhãn Vinyl":"비닐 라벨의 편차","Lệch Tape":"편차 테이프","do thao tác bóc TPU\u001a tiêu chuẩn hóa quy trinh":"표준화된 TPU 박리 공정으로 인해","Do Camera Auto Vision chưa ổn định":"Camera Auto Vision이 안정적이지 않기 때문에","Layout máy OK, Chờ ký đơn để tiến hành mua Jig và setup chương trình":"기계 레이아웃 확인, 지그 구매 및 프로그램 설정을 진행하려면 신청서에 서명할 때까지 기다리세요.","Chờ ký đơn để cải tiến thiết bị từ A566->A586":"A566->A586 장비 개선 신청서 서명 대기 중","Sau khi kí đơn xong thì tiến hành kiểm tra lịch trình mua jig và cải tiến máy":"신청서 서명 후 지그 구매 및 기계 개선 일정 확인을 진행합니다.","Sau khi kí đơn xong thì tiến hành kiểm tra lịch trình cải tiến máy và setup máy":"신청서 서명 후 기계 개선 일정 및 기계 설정 확인을 진행합니다.","Tỉ lệ NG cao, W1 tháng 11 tiếp tục line test kiểm chứng":"NG율 높아 11월 1일 라인 검증 계속","Chờ xác nhận tiêu chuẩn mối hàn":"용접기준 확정을 기다리는 중","Ngày 7/11 hoàn thành test máy":"11월 7일 기계 테스트 완료","Chờ ký đơn cải tiến thiết bị từ A566->A586":"A566->A586에서 장비 개선 양식 서명을 기다리는 중입니다.","Thiếu Tape MIC BTM":"BTM 마이크 테이프 누락","Điều chỉnh độ sáng vision min…":"비전의 밝기를 최소로 조정하세요.","Do đầu hút bám dính dị vật, độ sáng vision cài…":"석션 헤드에 이물질이 부착되어 있기 때문에 시야 밝기가 설정되어 있습니다 ...","Lệch tape":"테이프 편차","Xước":"할퀴다","Do camera auto vision chưa ổn định":"오토비전 카메라가 안정적이지 않기 때문에","Chỉnh sửa lại limit và độ sáng…":"한계와 밝기를 조정하세요...","AUTO 2 DÀN NG ĐẦU HÚT":"자동 2 NG 흡입 헤드","Bổ sung và tăng cường…":"보충하고 강화한다…","Do dị vật trên JIG":"JIG의 이물질로 인해","AUTO NAM CHANG NG MAIN ATN":"자동 NAM 창 NG 메인 ATN","LD NG MAIN":"LD OF 메인","AUTO DÀN 1 NG LỖI CHƯƠNG TRÌNH 1 BÊN":"한쪽에 자동 스테이징 1 NG 프로그램 오류","THIẾU NHÂN LỰC THỜI VỤ":"계절적 인력 부족","Có 5 tape mới, đang check với R&D team về lịch về. Sau khi có liệu mới sẽ mất 2,3day để thay đổi thứ tự line":"새로운 테이프가 5개 있는데 R&D팀에 출시일을 확인하고 있습니다. 새 데이터를 사용할 수 있게 된 후 라인 순서를 변경하는 데 2~3일이 소요됩니다.","Đang sản xuất phát triển giai đoạn PV2":"현재 생산 및 개발 단계 PV2","Đang trình ký đơn kian tới các sếp, sau khi phê duyệt sẽ tiến hành cải tạo máy":"서명된 신청서를 상사에게 제시하고 승인 후 기계를 개조합니다.","Yêu cầu bên RD cấp liệu cải tiến dạng cuộn để thay đổi thứ tự line auto":"라인 순서를 자동으로 변경할 수 있도록 개선된 롤 피드를 제공하도록 RD에 요청","Tape của A586 front có 5 tape thay đổi data mới":"A586 전면의 테이프에는 5개의 새로운 데이터 변경 테이프가 있습니다.","Vẫn đang tiếp tục setup, chỉnh máy. JIg laser đại trà đang chờ phê duyệt":"계속해서 기계를 설정하고 조정하고 있습니다. 대규모 JIg 레이저 승인 대기 중","Đang test 300ea với spec vswr cnc mới, có kết quả báo lại R&D TEAM, case input muộn cần bên R&D check lại kế hoạch xuất hàng ngày mai, việc ngày mai xuất 600ea gặp khó khăn":"새로운 vswr CNC 스펙으로 300개를 테스트한 결과는 R&D팀에 보고될 예정이며, 입력이 늦어질 경우 R&D측에서 내일 수출 계획을 확인해야 하므로 내일 600개 수출은 어려울 것 같습니다.","Đang check lịch tape dạng cuộn về":"롤업 테이프 일정 확인","Sau khi có liệu về thì bên tự động hoá sẽ mất 2,3 ngày để thay đổi":"데이터가 도착하면 자동화 측에서 변경하는 데 2~3일이 소요됩니다.","Lệch tape SPK":"레흐테이프 SPK","Lệch tape sponger UB":"레흐 테이프 스펀저 UB","Do nhân viên công đoạn đặt tape lệch vị trí jig/Hướng dẫn nhân viên công đoạn cập nhật sop.":"테이프를 잘못된 지그 위치에 배치하는 단계의 직원으로 인해/단계의 직원에게 SOP를 업데이트하도록 지시합니다.","Phát sinh lỗi lệch tại công đoạn Auto do phạm vi giới hạn (Limit) và tọa độ trục Z được thiết lập cao, dẫn đến phát sinh NG.":"Auto 단계에서는 제한된 범위(Limit)와 Z축 좌표가 높게 설정되어 있어 편차 오류가 발생하여 NG가 발생합니다.","Lệch Tape Sponge Mic Top":"레흐 테이프 스펀지 마이크 탑","Điều chỉnh phạm vi Limit: Chiều dài 150 → 80; giới hạn X 200 → 10; giới hạn Y 200 → 100.":"제한 범위 조정: 길이 150 → 80; 제한 X 200 → 10; Y 200 → 100으로 제한됩니다.","Jig gắn tape xuất hiện vết xước tại vị trí tiếp xúc, gây tác động lên sản phẩm và phát sinh lỗi xước.":"테이프 장착 지그는 접촉 위치에 긁힘이 있어 제품에 충격을 주며 긁힘 오류가 발생합니다.","Giảm giá trị giới hạn (Limit) và tăng điều kiện kiểm tra hình ảnh Vision tại công đoạn chụp nguyên liệu.":"한계값(Limit)을 낮추고, 원자재 캡쳐 단계에서 Vision 이미지를 확인하기 위한 조건을 높입니다.","Thông số giới hạn (Limit) được cài đặt quá cao":"한계 매개변수가 너무 높게 설정되었습니다.","Kiểm tra và xác nhận vị trí phát sinh lỗi. Sử dụng giấy nhám mịn 1200 để xử lý, loại bỏ bavia/vết xước tại vị trí tiếp xúc của jig.":"오류 위치를 확인하고 확인하십시오. 1200 고운 사포를 사용하여 지그 접촉 위치의 버/흠집을 가공하여 제거합니다.","-Điều chỉnh tọa độ trục Z: 4525 → 4490; 4450 → 4420; 4510 → 4490; 4480 → 4450.":"-Z축 좌표 조정: 4525 → 4490; 4450 → 4420; 4510 → 4490; 4480 → 4450.","Nhân viên gắn Vynyl Insert Upper lệch mấu Jig, dẫn đến Upper Deco bị lệch/":"Vynyl Insert Upper를 부착하는 직원이 Jig tab을 어긋나서 Deco Upper가 어긋나는 현상 발생/","Nhân viên gắn Vynyl Insert Upper lệch mấu Jig, dẫn đến Upper Deco bị lệch/Đào tạo nhân viên và bổ sung hình ảnh lỗi lệch, xoay Upper tại công đoạn dán Vinyl.":"Vynyl Insert Upper를 부착하는 직원이 Jig 탭을 잘못 정렬하여 Upper Deco가 잘못 정렬되었습니다./직원을 교육하고 비닐 접착 단계에서 Upper의 정렬 불량 및 회전 이미지를 추가합니다.","CASE NG":"케이스N.G","Xoay upper":"상단 회전","CƠ ĐIỆN":"전자기계","MẤT KHÍ TỔNG":"총 공기 손실","HỆ THỐNG ERP, MEST  BỊ LỖI  전산 오류 ( ERP, MES)":"Erp, mes 시스템에 결함이 있습니다. 전산 오류 (erp, mes)","AUTO":"자동","MÁY GẮN FPCB  NG":"NG fpcb 마운팅 머신","K ĐĂNG KÝ ĐƯỢC ( sản xuất đủ sản lượng )":"K CAN BE REGISTERED (충분한 출력 생성)","LỖI K LINK TỪ MES SANG ERP ( sản xuất đủ sản lượng )":"MES에서 ERP로의 연결 오류(전체 생산 능력)","MÁY MAIN ATN":"ATN 주요 기계","MÁY GẮN TAPE NG":"NG테이프 장착기","MÁY GẮN SUU.1,2 ATN":"기계 장착형 SUU.1,2 ATN","MÁY 6-8  NG LỖI TRỤC":"6-8 NG 기계에 축 오류가 있습니다","NG TỈ LỆ CAO ( OQC FAIL )":"NG 비율 높음(OQC 실패)","ngày mùng 4,5 sản xuất C-lot song rồi sản xuất đại trà":"4일, 5일 C-lot 생산 후 양산 예정","đang sản xuất  phát triển pv2":"PV2는 생산 및 개발 중입니다.","Đang sản xuất  phát triển PV2":"PV2는 생산 및 개발 중입니다.","Đơn yêu cầu cải tiến máy đang trình các sếp ký, sau khi ký xong sẽ tiến hàng mua cải tiến và setup máy":"기계 개선 요청이 상사에게 제출되어 서명을 받고 있습니다. 서명이 완료되면 개선 및 설정을 위해 기계를 구매하게 됩니다.","Ngày 4,5/11  sản xuất C-lot  tại xưởng 4.  Xong rồi kế hoạch sản xuất đại trà":"11월 4, 5일 4공장에서 C-lot 생산. 양산계획 완료","Đơn yêu cầu mua jig đang trình các sếp ký, sau khi ký xong sẽ tiến hàng mua jig và setup máy":"지그 구매 요청이 서명을 위해 상사에게 제출되고 있습니다. 서명이 완료되면 지그를 구입하고 기계를 설정합니다.","Đang trong quá trình test máy.":"기계 테스트가 진행 중입니다.","Đang sản xuất giai đoạn PV2":"PV2 단계가 생산 중입니다.","SPEC VSWR CNC thay đổi đã gửi lại bên R&D check -> cần R&D check và đưa ra spec chuẩn để áp dụng sản xuất đại trà":"SPEC VSWR CNC 변경 사항은 확인을 위해 R&D 측으로 다시 전송되었습니다. -> 대량 생산 적용을 위한 표준 사양 확인 및 제공을 위한 R&D 필요","Có 5 tape mới thay đổi, dự kiến 05/11 nhập về. Mất  2,3day để thay đổi thứ tự máy gắn":"새로 변경된 테이프는 5개이며, 11월 5일 수입 예정입니다. 장착 순서 변경에는 2.3일이 소요됩니다.","Đơn yêu cầu mua jig, cải tiến máy đang trình các sếp ký, sau khi ký xong sẽ tiến hàng mua jig và cải tiến máy":"지그 구매 및 기계 개선 요청이 상사에게 서명을 위해 제출되고 있습니다. 계약이 완료되면 지그 구매 및 기계 개선 작업을 진행합니다.","Đã chuẩn bị mẫu lỗi OK, NG sau gắn metal sheet. Yêu cầu bên nhóm QC, R&D đến xác nhận mức độ OK.NG để phục vụ sản xuất đại trà":"OK, NG 에러 샘플을 준비한 후 금속판을 부착합니다. 대량생산을 위한 OK.NG 레벨 확인을 QC, R&D팀에 요청","Ngày 4,5/11  sản xuất C-lot, Xong rồi kế hoạch sản xuất đại trà":"11월 4, 5일 C-lot 생산, 양산 계획 완료","Có 5 tape mới thay đổi, dự kiến 05/11 nhập về. Mất 2,3day để thay đổi thứ tự máy gắn":"새로 변경된 테이프는 5개이며, 11월 5일 수입 예정입니다. 장착 순서 변경에는 2.3일이 소요됩니다.","Đã":"이미","Đã chuẩn bị mẫu lỗi OK, NG sau gắn metal sheet. Yêu cầu bên":"OK, NG 에러 샘플을 준비한 후 금속판을 부착합니다. 파티요청","Đơn yêu cầu mua jig đang trình các , sau khi ký xong sẽ tiến hàng mua jig và setup máy":"지그 구매요청서를 제출중입니다. 서명이 완료되면 지그 구매 및 기계 설정을 진행합니다.","Đang đợi bộ phận mua hàng ký duyệt":"구매부서 승인을 기다리는 중","Máy gắn FPCB auto đang NG trục Z: bị rung khi gắn":"FPCB 자동 실장기가 Z축에 있어 실장 시 진동이 발생함","- Độ sáng đầu hút thấp → hình ảnh Vision không ổn định → ảnh hưởng xác định tâm.":"- 노즐 밝기가 낮음 → 비전 이미지가 불안정함 → 중심 판별에 영향을 미침.","- Độ sáng đầu hút thấp → hình ảnh Vision không ổn định → ảnh hưởng xác định tâm liệu.":"- 노즐 밝기가 낮음 → 비전 이미지가 불안정함 → 타겟 판별에 영향을 미침.","- Tăng điều kiện kiểm tra hình ảnh của Vision.":"- 비전의 이미지 확인 조건이 증가되었습니다.","Lệch tape sponger Fiducial":"레흐 테이프 스폰지퍼 Fiducial","- Điều chỉnh áp suất khí cấp cho cơ cấu đầu hút gắn tape lên mức >1,0bar.":"- 테이프 흡입 헤드 구조에 공급되는 공기 압력을 >1.0bar로 조정하십시오.","Lệch tape sub pcb 1.2":"테이프 서브 PCB의 편차 1.2","- Áp suất khí cấp cho cơ cấu đầu hút gắn tape đang được cài đặt ở mức \u003c 0,5bar thấp hơn điều kiện vẫn hành.":"- 테이프 장착형 흡입 헤드 구조의 공기압은 작동 조건보다 \u003c 0.5bar 낮게 설정됩니다.","- Điểm chuẩn và phạm vi tìm kiếm quá cao nên máy vẫn dán bình thường dù liệu bị lệch.":"- 벤치마크 및 검색 범위가 너무 높아서 데이터가 치우쳐져도 머신에서는 정상적으로 붙여넣기가 됩니다.","- Điều chỉnh tọa độ thiết lập điểm chuẩn xuống thấp và tọa độ phạm vi tìm kiếm xuống thấp.":"- 벤치마크 설정 좌표를 낮게, 검색 범위 좌표를 낮게 조정합니다.","- Máy rolling phím con lăn bị lệch/Điều chỉnh lại vị trí con lăn phím":"- 키 롤링 기계 롤러가 잘못 정렬됨/키 롤러 위치를 다시 조정","- Điểm chuẩn và phạm vi tìm kiếm  cao nên máy vẫn dán bình thường dù liệu bị lệch.":"- 벤치마크와 검색 범위가 높아서 데이터가 치우쳐져도 머신에서는 정상적으로 붙여넣기가 됩니다.","Cứng phím":"하드 키","- Do nguyên vật liệu đầu vào upper bụi bẩn/Tăng cường kiểm kiểm soát input,công đoạn line đào tạo phương pháp xì bụi tại công đoạn line sản xuất.":"- 먼지가 많은 상부투입재/투입량 통제 강화로 인해 라인단계에서는 생산라인 단계에서 먼지제거 방법을 교육하고 있습니다.","Dị vật,bụi bẩn":"이물질, 먼지","NG CHỈNH TÂM LIỆU":"NG는 소재를 조정","NG LỆCH ATN":"ATN과의 NG 편차","NG CHÂN NHIỆT":"열 발","THIẾT  BỊ":"장치","THIẾT BỊ":"장치","NG BODY  PRESS":"OF 바디프레스","NG  MÁY NÉN ( BODY )":"NG 압축기(본체)","- Do nguyên vật liệu đầu vào outer bụi bẩn, lẹm viền/Tăng cường kiểm kiểm soát input, vệ sinh xì bụi trước khi sản xuất":"- 외부투입재 먼지 및 찌그러짐으로 인해/투입제어 강화, 생산 전 먼지 청소","Sáng viền, Dị Vật":"밝은 가장자리, 이물질","THIỆT BỊ":"손상된 장비","ĐANG CHẠY C-LOT":"c-lot 실행","ĐANG CHẠY  LOT PV2":"LOT PV2 실행 중","yêu cầu rd và cnc cải tiến lỗi sáng viền, dị vật, vập, loang  dầu... chiếm 30% tỉ lệ lỗi":"밝은 가장자리, 이물질, 범프, 기름 유출 등의 오류를 개선하려면 rd 및 CNC가 필요합니다. 오류율은 30%입니다.","B ÁO":"신문","BÁO KINH DOANH Ê":"경제신문 아","BÁO KINH DOANH ASÁ":"아사 비즈니스 신문","BÁO KINH DOANH GỌI CASE":"비즈니스 신문 콜 케이스","TÂN KINH DOANH":"새로운 사업","NG CA":"NG 캘리포니아","AUTO NG MÁY GĂN ATN SUB 1,2":"자동 NG ATN SUB 1,2 장착기","LỆCH TAPE RUBBER MIC":"레흐 테이프 고무 MIC","LỆCH TAPE GASKET OCTA":"테이프 가스켓 옥타의 편차","LỆCH TAPE HR":"HR 테이프의 편차","Cần cải tiến lỗi dị vật, sáng viền, loang đen, loang dầu":"이물질, 밝은 모서리, 검은 반점, 기름 유출 등의 오류 개선 필요","Giai đoạn sản xuất PV2":"PV2 생산 단계","Giai đoạn sản xuất C-LOT":"C-LOT 생산 단계","Bong ATN":"봉 에이티엔","Thao tác nhân viên công đoạn miết ATN chưa đồng nhất/Hướng dẫn nhân viên công đoạn đồng nhất phương pháp.":"ATN 연삭 공정의 직원 작업이 일관되지 않습니다/방법을 균일화하도록 프로세스 직원에게 지시합니다.","sáng Viền, Loang Đen":"밝은 가장자리, 밝은 검정색","Vinyl dán upper lệch nguy cơ thao tác gắn tape lệch gây xoay upper/Kiểm soát nguyên vật liệu input,fb nhà cung cấp case.":"상단의 비닐 스티커가 잘못 정렬되어 테이프 장착 작업이 잘못 정렬되어 상단이 회전/입력 자료 제어를 유발할 위험이 있습니다. 케이스 공급업체 fb.","- Do thông số trục tọa độ X,Y,R lệch.":"- X,Y,R 좌표축 매개변수의 편차로 인해 발생합니다.","- Do cơ cấu định vị và giữ liệu chưa ổn định, khiến liệu bị xô lệch trong quá trình sản xuất.":"- 포지셔닝 및 재료 고정 구조가 안정적이지 않아 생산 과정에서 재료가 어긋나기 때문입니다.","- Tiến hành căn chỉnh lại đường dẫn liệu, điều chỉnh tọa độ điểm lấy tape":"- 피드 경로를 재정렬하고 테이프 픽업 지점의 좌표를 조정합니다.","sáng viền nguyên nhân do CNC thành outer bị mẻ,  Feeback CNC và R&D Cải tiến công đoạn, Loang đen do keo tape keo  mầu đen sát thành outer tương phản mầu/ Feeback R&D cải tiến tape":"Edge lightening은 외벽 파손으로 인해 발생 CNC, Feeback CNC 및 R&D 공정 개선, 외벽에 가까운 검정색 테이프 접착제로 인한 Blackness 색상 대비/ Feeback R&D로 테이프 개선","- Điều chỉnh lại thông số setting tọa độ trục X,Y,R tại điểm gắn tape phù hợp với vị trí thực tế của sản phẩm.":"- 테이프 부착점의 X, Y, R축 좌표 설정을 제품의 실제 위치와 일치하도록 조정합니다.","- Thay thế mắt camera mới và hiệu chỉnh lại hệ thống Vision để cải thiện chất lượng hình ảnh.":"- 카메라 아이를 새 것으로 교체하고 비전 시스템을 재보정하여 이미지 품질을 향상시킵니다.","- Tại vị trí camera chụp ảnh đầu hút, mắt camera bị bám keo và bụi bẩn --> lấy liệu lệch.": enting the signed application to the bosses, after approval, the machine will be renovated","Có 5 tape mới, đang check với R&D team về lịch về. Sau khi có liệu mới sẽ mất 2,3day để thay đổi thứ tự line":"There are 5 new tapes, checking with the R&D team about the release date. After new data is available, it will take 2-3 days to change the line order","Vẫn đang tiếp tục setup, chỉnh máy. JIg laser đại trà đang chờ phê duyệt":"Still continuing to setup and adjust the machine. Massive JIg laser is awaiting approval","Đang sản xuất phát triển giai đoạn PV2":"Currently in production and development phase PV2","Đang test 300ea với spec vswr cnc mới, có kết quả báo lại R&D TEAM, case input muộn cần bên R&D check lại kế hoạch xuất hàng ngày mai, việc ngày mai xuất 600ea gặp khó khăn":"Testing the 300ea with the new vswr cnc spec, the results will be reported to the R&D TEAM, in case of late input, the R&D side needs to check the export plan tomorrow, exporting the 600ea tomorrow will be difficult.","Lệch tape sponger UB":"Lệch tape sponger UB","Phát sinh lỗi lệch tại công đoạn Auto do phạm vi giới hạn (Limit) và tọa độ trục Z được thiết lập cao, dẫn đến phát sinh NG.":"Deviation errors arise at the Auto stage due to the limited range (Limit) and the Z axis coordinates being set high, leading to NG.","Điều chỉnh phạm vi Limit: Chiều dài 150 → 80; giới hạn X 200 → 10; giới hạn Y 200 → 100.":"Limit range adjustment: Length 150 → 80; limit X 200 → 10; limit Y 200 → 100.","MÁY 6-8  NG LỖI TRỤC":"6-8 NG machine has axis error","NG TỈ LỆ CAO ( OQC FAIL )":"NG rate HIGH (OQC fail)","Lệch Tape Sponge Mic Top":"Lệch Tape Sponge Mic Top","Giảm giá trị giới hạn (Limit) và tăng điều kiện kiểm tra hình ảnh Vision tại công đoạn chụp nguyên liệu.":"Reduce the limit value (Limit) and increase the conditions for checking Vision images at the raw material capture stage.","Xước":"Scratch","Jig gắn tape xuất hiện vết xước tại vị trí tiếp xúc, gây tác động lên sản phẩm và phát sinh lỗi xước.": /* ---------- modal / toast ---------- */
.mask{position:fixed;inset:0;background:rgba(15,28,38,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--card);color:var(--ink);border-radius:10px;width:min(460px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal.wide{width:min(980px,100%)}
.mh{background:var(--navy);color:#fff;padding:12px 16px;border-radius:10px 10px 0 0;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.mh .x{background:transparent;border:0;color:#fff;font-size:18px}
.mb{padding:16px;overflow:auto}.mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.mbtn{padding:7px 16px;border-radius:6px}.mbtn.pri{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}.mbtn.dan{background:var(--rI);border-color:var(--rI);color:#fff;font-weight:700}.mbtn.sm{padding:4px 10px;font-size:12px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}.fld>span{font-size:12px;font-weight:700;color:var(--h2)}
.radio{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;cursor:pointer}

/* every row gets a stable id so rows can be merged between PCs (new rows: random id, old data: same id on every PC) */
function makeRowId(){return "r_"+(globalThis.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+"_"+Math.random().toString(36).slice(2));}
function ensureRowIds(state,deterministic){
  if(!state||!state.days)return state;
  const fix=(arr,key)=>{if(!Array.isArray(arr))return;const seen=new Set();arr.forEach((r,i)=>{if(!r||typeof r!=="object"||Array.isArray(r))return;
    if(!r._id||seen.has(r._id))r._id=deterministic?(r._id?`${r._id}_d${i}`:`legacy_${key}_${i}`):makeRowId();seen.add(r._id)})};
  Object.entries(state.days).forEach(([date,D])=>{if(D&&typeof D==="object")DAY_SECS.forEach(s=>fix(D[s],`${date}_${s}`))});
  fix(state.tasks,"tasks");return state}

function fromV2(st){
  const MAP={issAuto:"issA",rsnAuto:"rsnA",rdtAuto:"rdtA",causeAuto:"causeA",picAuto:"picA",key:"_k"};
  const out={days:{},tasks:[],cur:st.cur,savedAt:st.savedAt||0,pdfs:st.pdfs||{},photos:st.photos||{},settings:{...(st.settings||{})}};
  Object.entries(st.days||{}).forEach(([d,o])=>{ const D={};
    Object.entries(o||{}).forEach(([k,v])=>{ const m=k.match(/^([pqesnw])(\d+)([A-Za-z_]\w*)$/);
      if(m && SEC[m[1]]){ const f=MAP[m[3]]||m[3]; if(m[1]==="e"&&(f==="fix"||f==="done")) return; (D[m[1]]=D[m[1]]||[]); (D[m[1]][+m[2]]=D[m[1]][+m[2]]||{})[f]=v; }
      else if(k!=="__rows") D[k]=v; });
    DAY_SECS.forEach(s=>{ if(D[s]) D[s]=D[s].filter(r=>r && !isEmptyRow(r)); });
    out.days[d]=D; });
  Object.entries(st.tasks||{}).forEach(([k,v])=>{ const m=k.match(/^k(\d+)(\w+)$/); if(m) (out.tasks[+m[1]]=out.tasks[+m[1]]||{})[m[2]]=v; });
  out.tasks=out.tasks.filter(r=>r && !isEmptyRow(r));
  return out;
}
function toV3(st){
  if(!st||typeof st!=="object"||!st.days) return null;
  const flat = !Array.isArray(st.tasks) || Object.values(st.days).some(d=>d&&Object.keys(d).some(k=>/^[pqesnw]\d+[a-zA-Z]/.test(k)));
  const o = flat ? fromV2(st) : clone(st);
  o.tasks=o.tasks||[]; o.pdfs=o.pdfs||{}; o.photos=o.photos||{}; o.settings=o.settings||{}; o.savedAt=o.savedAt||0;
  if(!Object.keys(o.days).length) o.days[ymd(new Date())]={basis:BASIS[0]};
  if(!o.cur||!o.days[o.cur]) o.cur=Object.keys(o.days).sort().pop();
  Object.values(o.days).forEach(D=>(D&&D.p||[]).forEach(r=>{if(r&&(r.iss!==undefined||r.issA!==undefined)){
    if(r.item===undefined&&r.iss!==undefined)r.item=r.iss;if(r.itemA===undefined&&r.issA!==undefined)r.itemA=r.issA;delete r.iss;delete r.issA}
    ["item","itemA"].forEach(k=>{const v=r&&r[k];if(typeof v==="string"&&/\d\s*\/\s*[\d,.]+\s*\(\s*[\d.,]+%\s*\)/.test(v))
      r[k]=v.split(/;\s*|\n/).map(x=>x.replace(/\s*:?\s*[\d,.]+\s*\/\s*[\d,.]+\s*\(\s*[\d.,]+%\s*\)\s*$/,"").trim()).filter(Boolean).join("\n")})}));
  if(!o.settings.mi2){Object.values(o.days).forEach(D=>{if(D&&D.prodSrc)(D.p||[]).forEach(r=>{if(r&&r.f==="4공장"&&(!String(r.item||"").trim()||r.item===r.itemA)){r.item="4F ASSEMBLY";r.itemA="4F ASSEMBLY"}})});o.settings.mi2=true}
  ensureRowIds(o,true);
  if(!o.settings.eMin){Object.values(o.days).forEach(D=>(D&&D.e||[]).forEach(r=>{if(r&&String(r.h??"").trim()!==""){const v=parseFloat(String(r.h).replace(/,/g,"."));if(!isNaN(v))r.h=String(Math.round(v*60))}}));o.settings.eMin=true}
  return o;
}

  req(st,mode,fn){return new Promise(res=>{if(!this.db)return res(null);try{const tx=this.db.transaction(st,mode),q=fn(tx.objectStore(st));tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>res(null)}catch(e){res(null)}})},

function modal({title,body,actions=[],wide=false,width,onMount}){

    m.innerHTML=`<div class="modal${wide?" wide":""}"${width?` style="width:min(${width}px,100%)"`:""}><div class="mh"><span>${esc(title)}</span><button class="x" data-v="__close">×</button></div><div class="mb">${body}</div>${actions.length?`<div class="mf">${actions.map(a=>`<button class="mbtn ${a.cls||""}" data-v="${a.v}">${esc(a.label)}</button>`).join("")}</div>`:""}</div>`;

const toT=v=>{if(v==null||v==="")return"";if(typeof v==="number"){const m=Math.round((v%1)*1440);return`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`}const m=String(v).match(/(\d{1,2}):(\d{2})/);return m?`${pad(m[1])}:${m[2]}`:String(v)};

function findProd(wb){for(const n of wb.SheetNames){const rows=grid(wb,n);for(let i=0;i<Math.min(15,rows.length);i++){const h=rows[i].map(x=>String(x).trim()),c=k=>h.indexOf(k);if(c("작업장명")>=0&&c("당일계획")>=0&&c("생산양품량")>=0)return{rows,hi:i,c:{date:c("계획일자"),ws:c("작업장명"),group:c("품목그룹"),plan:c("당일계획"),act:c("생산양품량"),reason:c("미달성사유"),detail:c("상세사유"),kind:c("구분"),code:c("품목코드")}}}}return null}

  D.p=pl.map(p=>{const v=P[p],o=old.find(r=>r.f===p)||{},r={f:p,plan:String(v.plan),act:String(v.act)};[["item",[...v.items]],["rsn",v.rsn],["rdt",v.rdt]].forEach(([t,a])=>{const au=a.join(t==="item"?"\n":"; ");r[t]=o[t]&&o[t]!==o[t+"A"]?o[t]:au;r[t+"A"]=au});return r});

function findStop(wb){for(const n of wb.SheetNames){const rows=grid(wb,n);for(let i=0;i<Math.min(20,rows.length);i++){const h=rows[i].map(x=>String(x).replace(/\s+/g," ").trim()),col=re=>h.findIndex(x=>re.test(x)),c={date:col(/날짜|^ngày/i),model:col(/모델|model/i),item:col(/^i[n]?tem/i),code:col(/코트|코드|code/i),mach:col(/품목명|máy/i),stop:col(/정지|dừng lại/i),start:col(/재가동|hoạt động lại/i),loss:col(/유실|thất thoát/i),resp:col(/귀책|quy trách/i)};if(c.date>=0&&c.stop>=0&&c.start>=0&&(c.loss>=0||c.mach>=0))return{rows,hi:i,c}}}return null}
function stopRecs(ss,fn){const g=(r,k)=>ss.c[k]>=0?r[ss.c[k]]:"",raw=ss.rows.slice(ss.hi+1).filter(r=>String(g(r,"mach")).trim()||num(g(r,"loss"))),yrs={};
  raw.forEach(r=>{const v=g(r,"date");if(typeof v==="number"&&v>30000){const y=ser(v).slice(0,4);yrs[y]=(yrs[y]||0)+1}});
  const fy=(String(fn).match(/(20\d{2})/)||[])[1],year=Object.entries(yrs).sort((a,b)=>b[1]-a[1]).map(x=>x[0])[0]||fy||String(new Date().getFullYear());
  const dd=v=>{if(typeof v==="number"){const s=ser(v);return v<30000?year+s.slice(4):s}const t=String(v).trim();let m;if(m=t.match(/^(\d{1,2})[\/.-](\d{1,2})$/))return`${year}-${pad(m[2])}-${pad(m[1])}`;return toD(t)};
  return raw.map(r=>{const st=g(r,"stop"),en=g(r,"start");let min=num(g(r,"loss"));if(!min&&typeof st==="number"&&typeof en==="number"){let d=(en%1)-(st%1);if(d<0)d+=1;min=d*1440}
    return{date:dd(g(r,"date")),model:String(g(r,"model")).trim(),item:String(g(r,"item")).trim(),code:String(g(r,"code")).trim(),mach:String(g(r,"mach")).replace(/\s+/g," ").trim(),start:toT(st),end:toT(en),min:Math.round(min),resp:String(g(r,"resp")).replace(/\s+/g," ").trim()}}).filter(r=>r.date)}

  D.e=gs.map(g=>{const o=keep[g.key]||{},cause=g.mach+(g.n>1?` (×${g.n})`:""),pic=[...g.resp].join(", ");
    return{f:/^\d공장$/.test(g.plant)?g.plant:"",eq:[g.model,g.item].filter(Boolean).join(" ")+(g.code?" · "+g.code:""),s:g.st.slice().sort()[0]||"",r:g.en.slice().sort().pop()||"",h:String(Math.round(g.min)),cnt:String(g.n),_k:g.key,cause:o.cause&&o.cause!==o.causeA?o.cause:cause,causeA:cause,pic:o.pic&&o.pic!==o.picA?o.pic:pic,picA:pic,fix:o.fix||""}});

      let date=toD(v("C3"));if(!date){date=S.cur;toast(T("noDateCur",{d:fmtDayLong(date)}))}

      D.e=rowsOf(23,27,{f:["B"],eq:["C"],s:["E","t"],r:["F","t"],h:["G","n"],cause:["H"],pic:["L"]});

/* time text → minutes since 00:00 (null if not a time). Accepts 8 · 830 · 08:30 · 8.30 · 8h · 8h30 · 8g30 · 08:30:00 · 8:30 PM */
function parseTime(v){v=String(v||"").trim().toLowerCase().replace(/\s+/g," ");if(!v)return null;let m,pm=/(pm|chiều|오후)/.test(v),am=/(am|sáng|오전)/.test(v);
  v=v.replace(/(am|pm|sáng|chiều|오전|오후)/g,"").trim();
  if((m=v.match(/^(\d{1,2})\s*(?:[:.hg시 ]\s*(\d{1,2}))?\s*(?:[:.]\s*\d{1,2})?\s*(?:h|g|시|giờ)?\s*(?:분|p|ph|phút|m)?$/))||(m=v.match(/^(\d{1,2})(\d{2})$/))){
    let H=+m[1],M=m[2]!=null?+m[2]:0;if(pm&&H<12)H+=12;if(am&&H===12)H=0;if(H<24&&M<60)return H*60+M}
  return null}
const normTime=v=>{const t=parseTime(v);return t==null?String(v||"").trim():`${pad(Math.floor(t/60))}:${pad(t%60)}`};

  if(hi&&document.activeElement!==hi)hi.value=fmtNum(r.h)}

/* bring the server copy (theirs) together with this device's data (mine) */

    const mg=mergeStates(base,mine,remote);stat=mg.stat;conflictsN=mg.conflicts.length;
    if(conflictsN){
      if(opt.auto)mg.conflicts.forEach(c=>c.apply(mgCopy(c.mine)));

        outcome=await mgResolve(mg.conflicts)}}

async function svPush(){

      if(rr!=null&&rr!==SV.rev){const f=await(await svFetch("/api/db",{},false)).json();if(f&&f.state)await svReconcile(f.state,f.rev??f.revision??rr)}}}catch(e){}

        if(syncEditSeq===sentSeq){if(!mgSame(S,j.state)){const k=keepUser(),cur=S.cur;S=toV3(j.state);Object.assign(S.settings,k);if(S.days[cur])S.cur=cur;
          try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}renderKeepFocus()}}

          const mg=mergeStates(sentState,clone(S),toV3(clone(j.state)));mg.conflicts.forEach(c=>c.apply(mgCopy(c.mine)));
          const k=keepUser(),cur=S.cur;S=toV3(mg.finish());Object.assign(S.settings,k);if(S.days[cur])S.cur=cur;try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}renderKeepFocus()}}

  try{
    const r=await svFetch("/api/db?meta=1",{},false);if(!r.ok){svSet("off");return}const m=await r.json();if(SV.st==="off")svSet("ok");
    const remoteRev=m.rev??m.revision??0;if(remoteRev===SV.rev)return;

document.addEventListener("focusout",e=>{const el=e.target;if(el&&el.dataset&&el.dataset.tr!==undefined)setTimeout(trApply,0)},true);

{const r0=render;render=function(){trAbsorb();r0();trApply()};
 const c0=calc;calc=function(){c0();trApply()};

/* ---- Download image (PNG): same page, selected language; long reports are cut at section borders ---- */
const HTI=["https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js","https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"];
async function loadHTI(){if(window.htmlToImage)return true;
  for(const u of HTI){const ok=await new Promise(r=>{const x=document.createElement("script");x.src=u;x.onload=()=>r(!!window.htmlToImage);x.onerror=()=>r(false);document.head.appendChild(x)});if(ok)return true}
  toast(T("lib"),"err");return false}
async function actSavePng(){
  if(!await loadHTI())return;const app=$("app");if(!app)return;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  toast(T("pngMaking"));trApply();document.body.classList.add("capturing");
  try{
    await new Promise(r=>setTimeout(r,700));trApply();fitAll();
    app.querySelectorAll("select").forEach(se=>se.querySelectorAll("option").forEach((o,i)=>i===se.selectedIndex?o.setAttribute("selected",""):o.removeAttribute("selected")));
    app.querySelectorAll("input").forEach(el=>el.setAttribute("value",el.value));
    app.querySelectorAll("textarea").forEach(el=>{el.textContent=el.value});
    await new Promise(r=>setTimeout(r,100));
    const W=Math.ceil(app.scrollWidth),H=Math.ceil(app.scrollHeight),pr=Math.min(2,15000/H),
          top0=app.getBoundingClientRect().top,
          cv=await htmlToImage.toCanvas(app,{pixelRatio:pr,backgroundColor:"#ffffff",skipFonts:true,width:W,height:H}),
          k=cv.width/W,tops=[...app.querySelectorAll(":scope > section.card")].map(c=>Math.round(c.getBoundingClientRect().top-top0)),
          MAXH=4500,cuts=[0];
    // start a new image before a section when adding it would make the current image taller than MAXH
    tops.forEach((t,i)=>{const bot=i+1<tops.length?tops[i+1]:H,c0=cuts[cuts.length-1];if(t>c0&&bot-c0>MAXH)cuts.push(t)});
    const bounds=[...cuts,H],n=bounds.length-1,base=`조립팀_일일업무보고_${S.cur}_${lang.toUpperCase()}`;
    for(let i=0;i<n;i++){const y0=Math.round(bounds[i]*k),y1=Math.min(cv.height,Math.round(bounds[i+1]*k)),c=document.createElement("canvas");
      c.width=cv.width;c.height=Math.max(1,y1-y0);const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(cv,0,y0,cv.width,c.height,0,0,c.width,c.height);
      const blob=await new Promise(r=>c.toBlob(r,"image/png"));
      await new Promise(r=>setTimeout(r,i?600:0));dl(`${base}${n>1?`_${i+1}of${n}`:""}.png`,blob)}
    toast(T("pngDone",{n}),"ok");
  }catch(e){console.error(e);toast(T("pngFail"),"err")}
  finally{document.body.classList.remove("capturing");trApply()}}

/* mở trang: luôn hiện NGÀY HÔM NAY (nếu đã có); chưa có thì hiện ngày gần nhất và nhắc tạo ngày mới.
   Tránh việc máy khác vẫn đứng ở ngày cũ (vd 10/11) rồi nhập số liệu 11/11 vào nhầm ngày. */
function openToday(notify){const t=ymd(new Date());openToday.last=t;
  if(S.days[t]){if(S.cur!==t){S.cur=t;tab="r";render()}return}
  const prev=dates().filter(d=>d<t),last=prev[prev.length-1];
  if(last&&S.cur!==last){S.cur=last;tab="r";render()}
  if(notify&&last){const d=fmtDayLong(t),msg=lang==="ko"?`오늘(${d}) 보고서가 아직 없습니다 — [새 날짜 입력]을 눌러 주세요`:lang==="vi"?`Chưa có báo cáo hôm nay (${d}) — bấm "Nhập ngày mới" trước khi nhập số liệu`:`No report for today (${d}) yet — click "New day" first`;toast(msg,"err")}}
(async function init(){
  await DB.open();
  const cands=[];
  try{const e=JSON.parse($("embedded-data").textContent||"null");if(e){const st=e.app==="assy-daily-report"&&e.state?e.state:e.days?e:null,s=toV3(st);if(s)cands.push({s,files:e.files,rank:3})}}catch(x){}
  const ls=(k,rank)=>{try{const s=toV3(JSON.parse(localStorage.getItem(k)||"null"));if(s)cands.push({s,rank})}catch(x){}};
  ls(LSK,2);ls("assy-report-v3",1);ls("assy-daily-v2",0);
  cands.sort((a,b)=>(b.s.savedAt||0)-(a.s.savedAt||0)||b.rank-a.rank);
  const pick=cands[0];S=pick?pick.s:toV3({days:{}});SV.fromEmbedded=!!(pick&&pick.rank===3);if(pick&&pick.files)await loadFiles(pick.files);
  if(!S.settings.ship2){Object.values(S.days).forEach(D=>{(D.s||[]).forEach(r=>{if(r.model&&!r.item){r.item=r.model;delete r.model}});
      if(!shipHasData(D.s))D.s=SHIP_LIST.map(([item,name])=>({item,name}))});S.settings.ship2=true}
  let l0=null;try{l0=localStorage.getItem("assy-lang")}catch(x){}
  lang=S.settings.lang||l0||"vi";
  if(S.settings.autoTr===undefined){try{const a=localStorage.getItem("assy-autotr");if(a)S.settings.autoTr=a==="1"}catch(x){}}
  const sv=await svInit();
  render();
  if(sv){await svStart(sv);
    setInterval(svPoll,2000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)svPoll()})}
  openToday(true);
  setInterval(()=>{if(ymd(new Date())!==openToday.last)openToday(true)},60000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&ymd(new Date())!==openToday.last)openToday(true)});
  render();await resumeAutoHtml();
})();
