<style>
:root{--navy:#172B3A;--navy2:#2E4657;--mint:#E9F5F3;--line:#C9D6DC;--ink:#1F2933;--muted:#6B7C88;--bg:#F3F6F7;--ok:#1E7F5C;--bad:#C0392B;--card:#fff;--y:#FFF5DE;--g:#EEF2F4;--focus:#E0A800;
  --gT:#EAF6EE;--gL:#BFE3CB;--gI:#1E7F3C;--gS:#23934A;--rT:#FDEEEE;--rL:#F3C2C2;--rI:#C0392B;--wT:#FFF8E6;--wL:#EBCB7A;--wI:#8A6100;--h2:#172B3A;--cb:#172B3A;--cbs:rgba(23,43,58,.14)}
@media(prefers-color-scheme:dark){:root{--ink:#E6EDF1;--bg:#12191F;--card:#1B252D;--line:#33444F;--mint:#22343A;--muted:#9AABB5;--y:#3A3420;--g:#27333B;--h2:#9FD3C7;
  --gT:#183126;--gL:#2D5B41;--gI:#7FD6A0;--rT:#3A1F1F;--rL:#6B3434;--rI:#F19A9A;--wT:#3A3220;--wL:#7A6330;--wI:#F0CC7A;--cb:#5F95B0;--cbs:rgba(0,0,0,.45)}}
*{box-sizing:border-box}
body{margin:0;font:13px/1.45 "Noto Sans KR","Malgun Gothic",Arial,sans-serif;background:var(--bg);color:var(--ink)}
svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,select,input,textarea{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:5px;background:var(--card);padding:4px 7px}
button{cursor:pointer}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:12px 20px 10px}
.hrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.hrow+.hrow{margin-top:8px}
.sp{flex:1}
header h1{margin:0 12px 0 0;font-size:19px;font-weight:700}
header button,header select{background:var(--navy2);color:#fff;border-color:#47677c}
header button.on{background:var(--focus);color:#000;border-color:var(--focus);font-weight:700}
header button:disabled{opacity:.35;cursor:default}
header label.nl{font-size:11px;font-weight:700;letter-spacing:.04em;opacity:.7;text-transform:uppercase}
header select{min-width:120px}
.chip{font-size:11px;border-radius:10px;padding:2px 9px;background:#2E4657;color:#cfe0e8;border:1px solid #47677c}
button.chip{display:inline-flex;gap:4px;align-items:center}
.saved{font-size:12px;color:#cfe0e8;white-space:nowrap}.saved b{color:#8FE0B4;font-weight:500}
.gb{display:inline-flex;gap:8px;align-items:center;padding:5px 12px;border-radius:6px}
.gb .tx{display:flex;flex-direction:column;line-height:1.15;text-align:left}.gb .m{font-weight:700}.gb .s{font-size:10px;opacity:.75}
.lang{display:flex;align-items:center;gap:6px;border:1px solid #47677c;border-radius:8px;padding:3px 8px;background:#10202b}.lang b{font-size:10px;letter-spacing:1px;opacity:.8}
.lang button.fl{width:34px;height:24px;padding:0;border:2px solid transparent;overflow:hidden;background:none;border-radius:4px;opacity:.6}
.lang button.fl.on{border-color:#fff;opacity:1}.lang svg{display:block;width:100%;height:100%}

/* ---------- tool panel ---------- */
.panel{background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px 12px;display:flex;flex-direction:column;gap:8px}
.panel.hidden{display:none}
.prow{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.divider{width:1px;background:var(--line);margin:0 6px}
.tb{display:inline-flex;align-items:center;gap:10px;padding:7px 14px 7px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-align:left;min-height:44px}
.tb .tx{display:flex;flex-direction:column;line-height:1.2}.tb .m{font-weight:700;font-size:13px}.tb .s{font-size:10.5px;color:var(--muted);margin-top:2px}
.tb:hover{filter:brightness(.97)}
.tb.green{background:var(--gT);border-color:var(--gL);color:var(--gI)}.tb.red{background:var(--rT);border-color:var(--rL);color:var(--rI)}
.tb.green .s,.tb.red .s,.tb.navyf .s,.tb.greenf .s,.tb.on .s,.tb.warn .s{color:inherit;opacity:.75}
.tb.navyf{background:var(--navy);border-color:var(--navy);color:#fff}.tb.greenf{background:var(--gS);border-color:var(--gS);color:#fff}
.tb.on{background:var(--gT);border-color:var(--gS);color:var(--gI);box-shadow:inset 0 0 0 1px var(--gS)}
.tb.warn{background:var(--wT);border-color:var(--wL);color:var(--wI)}

/* ---------- report body (card layout) ---------- */
main{max-width:1560px;margin:0 auto;padding:16px 24px 40px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:14px}
.meta label{font-size:11px;color:var(--muted);display:block}.meta input,.meta select{width:100%;background:var(--y)}
section.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:16px}
h2{margin:0 0 8px;font-size:15px;color:var(--h2);display:flex;align-items:baseline;flex-wrap:wrap;gap:0}
h2 .no{background:var(--navy);color:#fff;border-radius:4px;padding:1px 7px;margin-right:8px;font-size:12px}
h2 .sub{font-weight:400;color:var(--muted);margin-left:10px;font-size:12px}
h2 .hsp{flex:1}h2 button.imp{font-size:12px;font-weight:700;background:var(--navy);color:#fff;border-color:var(--navy);display:inline-flex;gap:6px;align-items:center;padding:4px 10px;align-self:center}
body.report h2 button.imp{display:none}@media print{h2 button.imp{display:none}}
.sp-tbl{width:100%;border-collapse:collapse;min-width:0;font-size:12px}.sp-tbl th{padding:4px 6px}.sp-tbl td{padding:0}.sp-tbl td.g{padding:4px 6px}
.sp-tbl input{width:100%;border:0;background:var(--y);padding:5px 6px;min-width:0}.sp-tbl input.n{text-align:right}.sp-tbl td.c input{text-align:center}
.prog-toast{min-width:260px}.prog-toast .pb{height:5px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:6px}.prog-toast .pb i{display:block;height:100%;width:0;background:#8FE0B4;border-radius:3px;transition:width .2s}
.sc{overflow-x:auto}.amw>div+div{margin-top:18px}.amw td{vertical-align:middle}.amw td select{text-align:center;text-align-last:center}.amw button.x{border:0;background:transparent;color:var(--bad);font-size:16px;cursor:pointer;opacity:.4;padding:0 6px}.amw button.x:hover{opacity:1}.amw>div{min-width:0}.amw table{min-width:0}.amw th{white-space:normal}.amw td input{min-width:0}.amh{font-size:13px;margin:0 0 6px}
table{border-collapse:collapse;width:100%;min-width:800px}
th,td{border:1px solid var(--line);padding:2px;vertical-align:top}
th{background:var(--navy);color:#fff;font-weight:500;padding:5px 6px;white-space:nowrap}
td.y{background:var(--y)}
td.g{background:var(--g);padding:6px 8px;text-align:right;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
td.g.c{text-align:center}
td.g.neg{background:#FBD3D6;color:#B3261E}@media(prefers-color-scheme:dark){td.g.neg{background:#4A2328;color:#F5A3A3}}
tr.t td.neg{background:#FBD3D6!important;color:#B3261E}
td.dup input{color:var(--muted)}body.report td.dup input{color:transparent}body.report td.dup{border-top-color:transparent}
body.report main input.dash::placeholder{color:var(--ink)}
@media print{td.dup input{color:transparent}td.dup{border-top-color:transparent}main input.dash::placeholder{color:#1F2933}}
td input,td select,td textarea{width:100%;border:0;background:transparent;border-radius:0;min-width:60px}
td textarea{min-width:180px;min-height:30px;resize:none;display:block;overflow:hidden;line-height:1.4}
[data-s="s"][data-k="item"],[data-s="s"][data-k="name"]{text-align:center}
td input.n{text-align:right;font-variant-numeric:tabular-nums}td input.tm{text-align:center;font-variant-numeric:tabular-nums}
td input:focus,td select:focus,td textarea:focus,.meta input:focus,.meta select:focus{outline:2px solid var(--focus);background:var(--card)}
tr.t td{background:var(--mint);font-weight:700;padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums}tr.t td:first-child{text-align:left}tr.t td.x{background:transparent}
th.x,td.x{width:30px;min-width:30px;text-align:center;background:transparent;border:0;padding:0 0 0 4px}
td.x button{color:var(--bad);padding:1px 6px;opacity:.35}tr:hover td.x button,td.x button:focus{opacity:1}
button.add{margin-top:8px;background:var(--mint)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two label{font-weight:700}.two textarea{width:100%;min-height:110px;background:var(--y);resize:vertical}
.ok{color:var(--ok)!important}.bad{color:var(--bad)!important}
.top td{padding:5px 8px}.bg{height:8px;background:var(--line);border-radius:4px;min-width:80px;margin-top:5px}.bg i{display:block;height:100%;border-radius:4px;background:var(--ok)}
.prog{position:relative}.prog .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--navy);opacity:.55}
select.st-계획{color:#455A69;font-weight:700}select.st-진행중{color:#1F5FA8;font-weight:700}select.st-지연{color:#B23A2E;font-weight:700}select.st-완료{color:#1E7F5C;font-weight:700}select.st-보류{color:#888;font-weight:700}
@media(max-width:700px){.two{grid-template-columns:1fr}main{padding:12px 16px 32px}header{padding:10px 16px}.panel{padding:10px 16px}}

/* ---------- modal / toast ---------- */
.mask{position:fixed;inset:0;background:rgba(15,28,38,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--card);color:var(--ink);border-radius:10px;width:min(460px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal.wide{width:min(980px,100%)}
.mh{background:var(--navy);color:#fff;padding:12px 16px;border-radius:10px 10px 0 0;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.mh .x{background:transparent;border:0;color:#fff;font-size:18px}
.mb{padding:16px;overflow:auto}.mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.mbtn{padding:7px 16px;border-radius:6px}.mbtn.pri{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}.mbtn.dan{background:var(--rI);border-color:var(--rI);color:#fff;font-weight:700}.mbtn.sm{padding:4px 10px;font-size:12px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}.fld>span{font-size:12px;font-weight:700;color:var(--h2)}
.radio{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;cursor:pointer}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.list{border:1px solid var(--line);border-radius:6px}.li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}.li .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li .d{font-size:11px;color:var(--muted)}.li.sel{background:var(--mint)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.pdfwrap{display:grid;grid-template-columns:300px 1fr;gap:12px;min-height:60vh}.pdfwrap iframe{width:100%;height:100%;min-height:60vh;border:1px solid var(--line);border-radius:6px;background:var(--g)}
.pv{width:100%;border-collapse:collapse;font-size:12px;min-width:0}.pv td,.pv th{padding:4px 6px}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:440px;font-size:13px;white-space:pre-line}
.toast.t-err{background:var(--rI)}.toast.t-ok{background:var(--gS)}
@media(max-width:700px){.pdfwrap{grid-template-columns:1fr}}

/* ---------- report view & print ---------- */
body.report main td.y,body.report .meta input,body.report .meta select,body.report .two textarea{background:var(--card)}
body.report main input,body.report main select,body.report main textarea{pointer-events:none;-webkit-appearance:none;appearance:none;resize:none}
body.report main input::placeholder{color:transparent}
body.report main input[type=date][value=""]{color:transparent}
body.report main input[type=date]::-webkit-calendar-picker-indicator{display:none}
body.report .x,body.report button.add,body.report .panel{display:none!important}
body.report main tr:nth-child(odd) td.y{background:color-mix(in srgb,var(--g) 45%,var(--card))}
@media print{
  header,.panel,.toasts,button.add,.x{display:none!important}
  body{background:#fff}main{max-width:none;padding:0}section.card{break-inside:avoid;border-color:#ccc}
  main td.y,.meta input,.meta select,.two textarea{background:#fff!important}
  main input,main select,main textarea{-webkit-appearance:none;appearance:none;resize:none}
  main input::placeholder{color:transparent}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:8mm}
  section.card{break-inside:auto!important}
  section.card h2{break-after:avoid}
  tr{break-inside:avoid}thead{display:table-header-group}
  section.card .sc,.sc{overflow:visible!important;max-height:none!important}
  td textarea{overflow:visible!important}
}

/* ---------- image capture (Download image) ---------- */
body.capturing .x,body.capturing button.add,body.capturing h2 button.imp,body.capturing .trb{display:none!important}
body.capturing section.card .sc{max-height:none!important;overflow:visible!important}
body.capturing section.card .sc th,body.capturing section.card .sc tr.t td{position:static!important}
body.capturing main td.y,body.capturing .meta input,body.capturing .meta select,body.capturing .two textarea{background:#fff!important}
body.capturing main input,body.capturing main select,body.capturing main textarea{-webkit-appearance:none;appearance:none;resize:none}
body.capturing main input::placeholder{color:transparent}
body.capturing td.csel{box-shadow:none;outline:none}
body.capturing main{max-width:none}
/* ---------- multi-cell select / copy / paste ---------- */
td.csel{box-shadow:inset 0 0 0 9999px rgba(30,127,92,.22);outline:1px solid var(--gS);outline-offset:-1px}
body.selecting{-webkit-user-select:none;user-select:none;cursor:cell}
body.selecting td input,body.selecting td textarea,body.selecting td select{pointer-events:none}
section[data-sec] th:not(.x){cursor:cell}
@media print{td.csel{box-shadow:none;outline:none}}

/* ---------- bold framed KPI cards ---------- */
section.card{border:2px solid var(--cb);border-top:5px solid var(--cb);border-radius:10px;box-shadow:0 3px 10px var(--cbs);padding:12px 16px 14px}
section.card>h2{padding-bottom:8px;margin-bottom:10px;border-bottom:1px solid var(--line)}
section.card .sc{border:1.5px solid var(--cb);border-radius:4px}
@media print{section.card{border:2px solid #172B3A;border-top:5px solid #172B3A;box-shadow:none}section.card .sc{border-color:#172B3A}}
.trb{border:1px solid #47677c;border-radius:8px;padding:4px 10px;background:#10202b;color:#cfe3f1;font-size:12px;font-weight:600;cursor:pointer;margin-left:6px;white-space:nowrap}.trb.on{background:#1d5f8a;border-color:#6fb3e0;color:#fff}
@media screen{td.y:has(.trd){box-shadow:inset 3px 0 0 #6fb3e0}.two textarea.trd{box-shadow:inset 3px 0 0 #6fb3e0}}
@media print{.trb{display:none}}
@media screen{
section.card .sc{max-height:min(540px,64vh);overflow:auto;scrollbar-width:thin;scrollbar-color:#8aa4b8 transparent}
section.card .sc::-webkit-scrollbar{width:10px;height:10px}section.card .sc::-webkit-scrollbar-thumb{background:#8aa4b8;border-radius:6px;border:2px solid transparent;background-clip:content-box}
section.card .sc th{position:sticky;top:0;z-index:3}
section.card .sc tr.t td{position:sticky;bottom:0;z-index:3;box-shadow:0 -1px 0 var(--cb)}section.card .sc tr.t td.x{background:var(--card)}
section.card .sc.more{box-shadow:inset 0 -14px 10px -12px rgba(23,43,58,.35)}
}
@media print{section.card .sc{max-height:none!important;overflow:visible!important}}
</style>
</head>

function fromV2(st){
  const MAP={issAuto:"issA",rsnAuto:"rsnA",rdtAuto:"rdtA",causeAuto:"causeA",picAuto:"picA",key:"_k"};
  const out={days:{},tasks:[],cur:st.cur,savedAt:st.savedAt||0,pdfs:st.pdfs||{},photos:st.photos||{},settings:{...(st.settings||{})}};
  Object.entries(st.days||{}).forEach(([d,o])=>{ const D={};
    Object.entries(o||{}).forEach(([k,v])=>{ const m=k.match(/^([pqesnw])(\d+)([A-Za-z_]\w*)$/);
      if(m && SEC[m[1]]){ const f=MAP[m[3]]||m[3]; if(m[1]==="e"&&(f==="fix"||f==="done")) return; (D[m[1]]=D[m[1]]||[]); (D[m[1]][+m[2]]=D[m[1]][+m[2]]||{})[f]=v; }
      else if(k!=="__rows") D[k]=v; });
    DAY_SECS.forEach(s=>{ if(D[s]) D[s]=D[s].filter(r=>r && !isEmptyRow(r)); });
    out.days[d]=D; });
  Object.entries(st.tasks||{}).forEach(([k,v])=>{ const m=k.match(/^k(\d+)(\w+)$/); if(m) (out.tasks[+m[1]]=out.tasks[+m[1]]||{})[m[2]]=v; });
  out.tasks=out.tasks.filter(r=>r && !isEmptyRow(r));
  return out;
}
function toV3(st){
  if(!st||typeof st!=="object"||!st.days) return null;
  const flat = !Array.isArray(st.tasks) || Object.values(st.days).some(d=>d&&Object.keys(d).some(k=>/^[pqesnw]\d+[a-zA-Z]/.test(k)));
  const o = flat ? fromV2(st) : clone(st);
  o.tasks=o.tasks||[]; o.pdfs=o.pdfs||{}; o.photos=o.photos||{}; o.settings=o.settings||{}; o.savedAt=o.savedAt||0;
  if(!Object.keys(o.days).length) o.days[ymd(new Date())]={basis:BASIS[0]};
  if(!o.cur||!o.days[o.cur]) o.cur=Object.keys(o.days).sort().pop();
  Object.values(o.days).forEach(D=>(D&&D.p||[]).forEach(r=>{if(r&&(r.iss!==undefined||r.issA!==undefined)){
    if(r.item===undefined&&r.iss!==undefined)r.item=r.iss;if(r.itemA===undefined&&r.issA!==undefined)r.itemA=r.issA;delete r.iss;delete r.issA}
    ["item","itemA"].forEach(k=>{const v=r&&r[k];if(typeof v==="string"&&/\d\s*\/\s*[\d,.]+\s*\(\s*[\d.,]+%\s*\)/.test(v))
      r[k]=v.split(/;\s*|\n/).map(x=>x.replace(/\s*:?\s*[\d,.]+\s*\/\s*[\d,.]+\s*\(\s*[\d.,]+%\s*\)\s*$/,"").trim()).filter(Boolean).join("\n")})}));
  if(!o.settings.mi2){Object.values(o.days).forEach(D=>{if(D&&D.prodSrc)(D.p||[]).forEach(r=>{if(r&&r.f==="4공장"&&(!String(r.item||"").trim()||r.item===r.itemA)){r.item="4F ASSEMBLY";r.itemA="4F ASSEMBLY"}})});o.settings.mi2=true}
  return o;
}

function modal({title,body,actions=[],wide=false,width,onMount}){
  return new Promise(res=>{
    const m=document.createElement("div");m.className="mask";
    m.innerHTML=`<div class="modal${wide?" wide":""}"${width?` style="width:min(${width}px,100%)"`:""}><div class="mh"><span>${esc(title)}</span><button class="x" data-v="__close">×</button></div><div class="mb">${body}</div>${actions.length?`<div class="mf">${actions.map(a=>`<button class="mbtn ${a.cls||""}" data-v="${a.v}">${esc(a.label)}</button>`).join("")}</div>`:""}</div>`;
    const done=v=>{const data={};m.querySelectorAll("[name]").forEach(e=>{if(e.type==="radio"||e.type==="checkbox"){if(e.checked)data[e.name]=e.value}else data[e.name]=e.value});m.remove();document.removeEventListener("keydown",kd);res({v,data})};
    const kd=e=>{if(e.key==="Escape")done(null)};
    m.addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(b&&b.closest(".mh,.mf"))done(b.dataset.v==="__close"?null:b.dataset.v);else if(e.target===m)done(null)});
    document.addEventListener("keydown",kd);document.body.appendChild(m);m._close=done;if(onMount)onMount(m)});
}

function goDay(d){if(!S.days[d])return;S.cur=d;tab="r";persist();render()}
const latestBefore=date=>{const ds=dates(),b=ds.filter(d=>d<date);return b.length?b[b.length-1]:ds[ds.length-1]};
function makeDay(date,mode="template"){const src=latestBefore(date)?S.days[latestBefore(date)]:null;
  if(mode==="copyAll"&&src){const c=clone(src);delete c.prodSrc;delete c.stopSrc;return c}
  const d=mode==="blank"?{}:{basis:BASIS[0]}; if(mode==="copy05"&&src&&src.n) d.n=clone(live(src.n));
  const base=src&&shipHasData(src.s)?live(src.s).filter(r=>r.item||r.name).map(r=>({item:r.item||"",name:r.name||""})):SHIP_LIST.map(([item,name])=>({item,name}));
  if(mode!=="blank") d.s=base; return d}
const nextFree=from=>{let d=parseYmd(from);for(let i=0;i<400;i++){d.setDate(d.getDate()+1);const s=ymd(d);if(!S.days[s])return s}return ymd(new Date())};
const copyRadios=def=>["template","copy05","copyAll","blank"].map(m=>`<label class="radio"><input type="radio" name="mode" value="${m}"${m===def?" checked":""}><span>${esc(T("cm_"+m))}</span></label>`).join("");

async function actNewMonth(){

  const r=await modal({title:T("newMonthTitle"),body:`<label class="fld"><span>${esc(T("pickMonth"))}</span><input type="month" name="month" value="${defM}" id="mInp"></label><label class="fld"><span>${esc(T("startDate"))}</span><input type="date" name="date" value="${defM}-01" id="dInp"></label><div class="fld"><span>${esc(T("copyMode"))}</span>${copyRadios("template")}</div>`,

async function removeDays(list){for(const d of list){for(const p of[...(S.pdfs[d]||[]),...(S.photos[d]||[])])await delFile(p.id);delete S.pdfs[d];delete S.photos[d];delete S.days[d]}

  if(!S.days[S.cur]){const ds=dates();S.cur=ds.filter(d=>d<list[0]).pop()||ds[0]}}

async function renameDay(nd){const od=S.cur;if(!/^\d{4}-\d{2}-\d{2}$/.test(nd)||nd===od){render();return}

const NORM=s=>String(s??"").toUpperCase().replace(/\s+/g," ").trim();
const ser=n=>new Date(Math.round((n-25569)*864e5)).toISOString().slice(0,10);
const toD=v=>{if(v==null||v==="")return"";if(typeof v==="number")return ser(v);if(v instanceof Date)return ymd(v);const s=String(v).trim();let m;if(m=s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/))return`${m[1]}-${pad(m[2])}-${pad(m[3])}`;if(m=s.match(/^(\d{1,2})[-./](\d{1,2})[-./](\d{4})/))return`${m[3]}-${pad(m[2])}-${pad(m[1])}`;return""};
const toT=v=>{if(v==null||v==="")return"";if(typeof v==="number"){const m=Math.round((v%1)*1440);return`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`}const m=String(v).match(/(\d{1,2}):(\d{2})/);return m?`${pad(m[1])}:${m[2]}`:String(v)};
const grid=(wb,n)=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""});
const tgOpts=date=>[["Same",date],["Next",addDays(date,1)],["Cur",S.cur]].filter((t,i,a)=>a.findIndex(x=>x[1]===t[1])===i);
const tgHTML=date=>`<span>${esc(T("target"))}</span>`+tgOpts(date).map(([k,d],i)=>`<label class="radio"><input type="radio" name="tg" value="${d}"${i===0?" checked":""}><span>${esc(T("tg"+k,{d:fmtDayLong(d)}))}${S.days[d]?"":" ✚"}</span></label>`).join("");
const rulesTA=(name,list)=>`<textarea name="${name}" rows="5" style="font:12px/1.5 monospace;padding:8px;width:100%">${esc(list.join("\n"))}</textarea>`;
const readRules=t=>String(t||"").split("\n").map(x=>x.trim()).filter(Boolean);

/* ---- production plan (생산계획상세조회 P4810QA40) → 01 ---- */
function findProd(wb){for(const n of wb.SheetNames){const rows=grid(wb,n);for(let i=0;i<Math.min(15,rows.length);i++){const h=rows[i].map(x=>String(x).trim()),c=k=>h.indexOf(k);if(c("작업장명")>=0&&c("당일계획")>=0&&c("생산양품량")>=0)return{rows,hi:i,c:{date:c("계획일자"),ws:c("작업장명"),group:c("품목그룹"),plan:c("당일계획"),act:c("생산양품량"),reason:c("미달성사유"),detail:c("상세사유"),kind:c("구분"),code:c("품목코드")}}}}return null}
function prodRecs(ps){const g=(r,k)=>ps.c[k]>=0?r[ps.c[k]]:"";return ps.rows.slice(ps.hi+1).map(r=>({date:toD(g(r,"date")),ws:NORM(g(r,"ws")),group:String(g(r,"group")).trim(),kind:String(g(r,"kind")).trim(),code:String(g(r,"code")).trim(),plan:num(g(r,"plan")),act:num(g(r,"act")),reason:String(g(r,"reason")).trim(),detail:String(g(r,"detail")).trim()})).filter(r=>r.date&&(r.ws==="ASSEMBLY"||r.ws==="4F ASSEMBLY"))}
function plantOf(r,rules){if(r.ws==="4F ASSEMBLY")return"4공장";const f=NORM(r.group+" "+r.kind),k=NORM(r.kind);return rules.some(x=>{const q=NORM(x);return q&&(f.includes(q)||k.includes(q))})?"3공장":"1공장"}
function prodSum(recs,rules){const P={};FAC.forEach(k=>P[k]={plan:0,act:0,n:0,miss:[],items:new Set(),rsn:[],rdt:[]});const bm={};
  recs.forEach(r=>{const p=plantOf(r,rules);P[p].plan+=r.plan;P[p].act+=r.act;P[p].n++;{const lb=p==="4공장"?r.ws:(r.group+" "+r.kind).replace(/\s+/g," ").trim();if(lb)P[p].items.add(lb)}const key=p+"|"+r.group+"|"+r.kind,m=bm[key]=bm[key]||{p,group:r.group,kind:r.kind,plan:0,act:0,rs:new Set(),dt:new Set()};m.plan+=r.plan;m.act+=r.act;if(r.reason)m.rs.add(r.reason);if(r.detail)m.dt.add(r.detail)});
  const ms=Object.values(bm);
  FAC.forEach(p=>{const w=ms.filter(m=>m.p===p&&(m.rs.size||m.dt.size)),pre=w.length>1;w.forEach(m=>{const tg=pre?m.group+": ":"";if(m.rs.size)P[p].rsn.push(tg+[...m.rs].join(" / "));if(m.dt.size)P[p].rdt.push(tg+[...m.dt].join(" / "))})});return P}
function applyProd(D,P,file,pd){const old=live(D.p),pl=FAC.filter(p=>P[p].n>0);if(!pl.length)return;
  D.p=pl.map(p=>{const v=P[p],o=old.find(r=>r.f===p)||{},r={f:p,plan:String(v.plan),act:String(v.act)};[["item",[...v.items]],["rsn",v.rsn],["rdt",v.rdt]].forEach(([t,a])=>{const au=a.join(t==="item"?"\n":"; ");r[t]=o[t]&&o[t]!==o[t+"A"]?o[t]:au;r[t+"A"]=au});return r});
  D.prodSrc={file,date:pd,at:Date.now()}}
/* one row per model / item code, in the same order as the original MES file (plants kept together) */
function prodModels(recs,rules){const G=[],idx={};
  recs.forEach(r=>{const p=plantOf(r,rules),key=[p,r.group,r.kind,r.code].join("|");let g=idx[key];
    if(!g){g=idx[key]={p,key,group:r.group,kind:r.kind,code:r.code,ws:r.ws,plan:0,act:0,rs:new Set(),dt:new Set()};G.push(g)}
    g.plan+=r.plan;g.act+=r.act;if(r.reason)g.rs.add(r.reason);if(r.detail)g.dt.add(r.detail)});
  return FAC.flatMap(p=>G.filter(g=>g.p===p))}
function applyProdModel(D,G,file,pd){if(!G.length)return;const old=live(D.p);
  D.p=G.map(g=>{const name=(g.group||g.kind?(g.group+" "+g.kind):g.ws).replace(/\s+/g," ").trim(),label=name+(g.code?"\n"+g.code:"");
    const o=old.find(r=>r._k===g.key)||{},r={f:g.p,_k:g.key,plan:String(g.plan),act:String(g.act)};
    [["item",label],["rsn",[...g.rs].join(" / ")],["rdt",[...g.dt].join(" / ")]].forEach(([t,au])=>{r[t]=o[t]&&o[t]!==o[t+"A"]?o[t]:au;r[t+"A"]=au});return r});
  D.prodSrc={file,date:pd,at:Date.now()}}
async function importProduction(ps,fileName,rep){
  const recs=prodRecs(ps);if(!recs.length){toast(T("prodNone"),"err");return false}
  const ds=[...new Set(recs.map(r=>r.date))].sort(),def=ds.includes(S.cur)?S.cur:ds[ds.length-1],of=d=>recs.filter(r=>r.date===d);
  let rules=S.settings.plant3||PLANT3_DEFAULT;
  const preview=(d,rl)=>{const P=prodSum(of(d),rl);return`<table class="pv"><tr><th>${T("factory")}</th><th>#</th><th>${T("plan")}</th><th>${T("act")}</th><th>${T("rate")}</th></tr>${FAC.filter(k=>P[k].n).map(k=>{const v=P[k],r=v.plan?v.act/v.plan*100:null;return`<tr><td>${esc(lab(k))}</td><td style="text-align:right">${v.n}</td><td style="text-align:right">${fmt(v.plan)}</td><td style="text-align:right">${fmt(v.act)}</td><td style="text-align:right;font-weight:700" class="${rateCls(r)}">${r===null?"–":r.toFixed(1)+"%"}</td></tr>`}).join("")}</table>`};
  const r=await modal({title:T("prodTitle"),width:620,body:`<div class="note" style="margin:0 0 10px">${T("file")}: <b>${esc(fileName)}</b> · ${esc(T("nDays",{n:ds.length}))} · ${esc(T("rowsN",{n:recs.length}))}</div>
    <label class="fld"><span>${T("dataDate")}</span><select name="date" id="pdDate">${ds.map(d=>{const c=of(d),pl=c.reduce((a,x)=>a+x.plan,0),ac=c.reduce((a,x)=>a+x.act,0);return`<option value="${d}"${d===def?" selected":""}>${esc(fmtDayLong(d))} — ${fmt(ac)}/${fmt(pl)} (${pl?(ac/pl*100).toFixed(1):0}%)</option>`}).join("")}</select></label>
    <div id="pdPrev" style="margin-bottom:12px">${preview(def,rules)}</div><div class="fld" id="pdTg">${tgHTML(def)}</div>
    ${ds.length>1?`<label class="radio"><input type="checkbox" name="all" value="1" id="pdAll"><span>${esc(T("allDays",{n:ds.length}))}</span></label>`:""}
    <div class="fld" style="margin-top:10px"><span>${esc(T("pmTitle"))}</span>${["model","plant"].map(v=>`<label class="radio"><input type="radio" name="pm" value="${v}"${(S.settings.prodMode||"model")===v?" checked":""}><span>${esc(T(v==="model"?"pmModel":"pmPlant"))}</span></label>`).join("")}</div>
    <label class="fld" style="margin-top:10px"><span>${esc(T("prodRules"))}</span>${rulesTA("rules",rules)}</label><div class="note">${esc(T("keepNote"))}</div>`,
    actions:[{v:"no",label:T("cancel")},{v:"ok",label:T("apply"),cls:"pri"}],
    onMount:m=>{const sel=m.querySelector("#pdDate"),ta=m.querySelector("[name=rules]"),all=m.querySelector("#pdAll"),upd=()=>m.querySelector("#pdPrev").innerHTML=preview(sel.value,readRules(ta.value));
      sel.addEventListener("change",()=>{upd();m.querySelector("#pdTg").innerHTML=tgHTML(sel.value)});ta.addEventListener("input",upd);if(all)all.addEventListener("change",()=>m.querySelector("#pdTg").style.opacity=all.checked?.4:1)}});
  if(r.v!=="ok")return false;
  rules=readRules(r.data.rules);S.settings.plant3=rules;
  const plan=r.data.all==="1"?ds.map(d=>[d,d]):[[r.data.date||def,r.data.tg||r.data.date||def]];
  const pm=S.settings.prodMode=r.data.pm||"model";
  plan.forEach(([d,tg])=>{if(!S.days[tg])S.days[tg]=makeDay(tg);if(pm==="model")applyProdModel(S.days[tg],prodModels(of(d),rules),fileName,d);else applyProd(S.days[tg],prodSum(of(d),rules),fileName,d)});
  S.cur=plan[plan.length-1][1];rep.push(r.data.all==="1"?T("prodMulti",{n:plan.length}):T("prodDone",{p:fmtDayLong(plan[0][0]),t:fmtDayLong(plan[0][1])}));return true}

/* ---- STOP LINE report → 03 ---- */
function findStop(wb){for(const n of wb.SheetNames){const rows=grid(wb,n);for(let i=0;i<Math.min(20,rows.length);i++){const h=rows[i].map(x=>String(x).replace(/\s+/g," ").trim()),col=re=>h.findIndex(x=>re.test(x)),c={date:col(/날짜|^ngày/i),model:col(/모델|model/i),item:col(/^i[n]?tem/i),code:col(/코트|코드|code/i),mach:col(/품목명|máy/i),stop:col(/정지|dừng lại/i),start:col(/재가동|hoạt động lại/i),loss:col(/유실|thất thoát/i),resp:col(/귀책|quy trách/i)};if(c.date>=0&&c.stop>=0&&c.start>=0&&(c.loss>=0||c.mach>=0))return{rows,hi:i,c}}}return null}
function stopRecs(ss,fn){const g=(r,k)=>ss.c[k]>=0?r[ss.c[k]]:"",raw=ss.rows.slice(ss.hi+1).filter(r=>String(g(r,"mach")).trim()||num(g(r,"loss"))),yrs={};
  raw.forEach(r=>{const v=g(r,"date");if(typeof v==="number"&&v>30000){const y=ser(v).slice(0,4);yrs[y]=(yrs[y]||0)+1}});
  const fy=(String(fn).match(/(20\d{2})/)||[])[1],year=Object.entries(yrs).sort((a,b)=>b[1]-a[1]).map(x=>x[0])[0]||fy||String(new Date().getFullYear());
  const dd=v=>{if(typeof v==="number"){const s=ser(v);return v<30000?year+s.slice(4):s}const t=String(v).trim();let m;if(m=t.match(/^(\d{1,2})[\/.-](\d{1,2})$/))return`${year}-${pad(m[2])}-${pad(m[1])}`;return toD(t)};
  return raw.map(r=>{const st=g(r,"stop"),en=g(r,"start");let min=num(g(r,"loss"));if(!min&&typeof st==="number"&&typeof en==="number"){let d=(en%1)-(st%1);if(d<0)d+=1;min=d*1440}

const TR_GLO=[["thay liệu","자재 교체","material change"],["lỗi chương trình","프로그램 오류","program error"],["thiết bị auto","자동화 설비","auto equipment"],["thiết bị","설비","equipment"],["hỏng","고장","broken"],
  ["dây curoa","벨트","belt"],["đứt","끊어짐","broken"],["lệch","틀어짐","misaligned"],["thiếu","부족","shortage of"],["xước","스크래치","scratch"],["dị vật","이물","foreign matter"],["không lấy","픽업 불가","not picking"],
  ["máy chủ","메인 PC","main PC"],["máy","설비","machine"],["sửa","수리","repair"],["liên tục","연속","continuous"],["nhân lực thời vụ","단기 인력","seasonal workers"],["nhân lực","인력","manpower"],["hành chính","총무","admin"],
  ["hết case","케이스 소진","out of cases"],["không đủ","부족","not enough"],["chất lượng","품질","quality"],["công đoạn trước","전공정","previous process"],["công đoạn","공정","process"],["sản xuất","생산","production"],
  ["tiêu chuẩn hóa","표준화","standardize"],["quy trình","프로세스","procedure"],["do ","원인: ","due to "],["chưa ổn định","불안정","unstable"],["điều chỉnh","조정","adjust"],["độ sáng","밝기","brightness"],["đầu hút","흡착 노즐","suction nozzle"],
  ["bám dính","부착","stuck"],["kiểm tra","점검","check"],["hoàn thành","완료","completed"],["chờ ký đơn","결재 대기","awaiting approval"],["đang chuẩn bị","준비 중","preparing"],["đang test","테스트 중","testing"],["tỉ lệ","비율","rate"],["cao","높음","high"],["mất","손실","lost"],["bộ nhớ","메모리","memory"],["đầy","가득 참","full"]];
const trSave=()=>{clearTimeout(TRQ.saveT);TRQ.saveT=setTimeout(()=>{try{localStorage.setItem("assy-tr-cache",JSON.stringify(TRC))}catch(e){}},800)};
function trMerge(src){if(!src||typeof src!=="object")return;["ko","vi","en"].forEach(l=>{if(src[l]&&typeof src[l]==="object")Object.assign(TRC[l],src[l])})}
function trTrim(){["ko","vi","en"].forEach(l=>{const k=Object.keys(TRC[l]);if(k.length>4000)k.slice(0,k.length-4000).forEach(x=>delete TRC[l][x])})}
/* all-caps shop text translates badly → sentence case, keeping short codes (NG, PC, LD…) and anything with digits */
function trPrep(s){let t=s;TR_PRE.forEach(([re,v])=>t=t.replace(re,v));
  const L=t.replace(/[^A-Za-zÀ-ỹ]/g,""),U=L.replace(/[^A-ZÀ-Ỹ]/g,"");
  if(L.length>=6&&U.length/L.length>.8){t=t.split(/(\s+)/).map(w=>/\d/.test(w)||(w.length<=3&&!VIC.test(w))?w:w.toLowerCase()).join("");t=t.replace(/^(\W*)(\p{L})/u,(m,a,b)=>a+b.toUpperCase())}
  return t}
/* is this line already in the target language? */
function trNeed(line,tl){if(!LETTER.test(line))return false;const h=HAN.test(line),v=VIC.test(line);
  if(tl==="ko")return !(h&&!v)&&/[A-Za-zÀ-ỹ]{2}/.test(line.replace(HANg,""));
  if(tl==="vi")return h||!v&&/[A-Za-z]{3}/.test(line);
  return h||v||/[A-Za-z]{3}/.test(line)}
/* "Vietnamese text + the same meaning in Korean" on one line */
function trBilingual(line){const hn=(line.match(HANg)||[]).length;if(hn<3)return null;
  const rest=line.replace(/[ᄀ-ᇿ㄰-㆏가-힯][ᄀ-ᇿ㄰-㆏가-힯\s()[\]0-9.,·/\-]*/g," ").replace(/\s+/g," ").trim();
  if((rest.match(VICg)||[]).length<2||rest.replace(/[^A-Za-zÀ-ỹ]/g,"").length<8)return null;
  const runs=line.match(/[\u1100-\u11FF\u3130-\u318F\uAC00-\uD7AF][\u1100-\u11FF\u3130-\u318F\uAC00-\uD7AF\s()[\]0-9.,·/\-]*/g)||[];
  if(runs.length!==1)return null;const ko=runs[0].trim(),L=line.trim();if(!(L.startsWith(ko)||L.endsWith(ko)))return null;
  return{ko,vi:rest}}
function trGlossary(line,tl){if(tl==="vi")return line;const i=tl==="ko"?1:2;let t=line;
  [...TR_GLO].sort((a,b)=>b[0].length-a[0].length).forEach(g=>{const re=new RegExp(g[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");t=t.replace(re,g[i])});return t}
/* one line → translated line, or undefined while waiting for the service */
function trLine(line,tl){const lead=line.match(/^\s*/)[0],body=line.trim();if(!body)return line;
  const bi=trBilingual(body);let src=body;
  if(bi){if(tl==="ko")return lead+bi.ko;if(tl==="vi")return lead+bi.vi;src=bi.vi}
  if(!trNeed(src,tl))return lead+src;
  const c=TRC[tl][src];if(c!==undefined)return lead+c;
  const fk=tl+"\u0001"+src;
  if(TRQ.fail[fk]&&Date.now()-TRQ.fail[fk]<60000)return lead+trGlossary(src,tl);
  trQueue(tl,src);return undefined}
function trText(o,tl){if(!o||!String(o).trim())return o;const out=[];
  for(const l of String(o).split("\n")){const r=trLine(l,tl);if(r===undefined)return null;out.push(r)}return out.join("\n")}
async function trFetch(q,tl){
  const tries=[["https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=auto&tl=",j=>(j[0]||[]).map(x=>x&&x[0]||"").join("")],
               ["https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=auto&tl=",j=>Array.isArray(j[0])?j[0][0]:j[0]]];
  for(const[u,pick]of tries){try{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),9000);
      const r=await fetch(u+tl+"&q="+encodeURIComponent(q),{signal:ctl.signal});clearTimeout(tm);if(!r.ok)continue;
      const t=pick(await r.json());if(typeof t==="string"&&t.trim())return t.trim()}catch(e){}}
  throw new Error("tr")}
function trQueue(tl,src){const k=tl+"\u0001"+src;if(TRQ.pend.has(k))return;TRQ.pend.add(k);trPump();trBtnUpd()}
function trPump(){
  while(TRQ.run<4){const k=[...TRQ.pend].find(x=>!TRQ.act.has(x));if(!k)return;TRQ.act.add(k);TRQ.run++;
    const[tl,src]=k.split("\u0001");
    trFetch(trPrep(src),tl).then(t=>{TRC[tl][src]=t;trSave()})
      .catch(()=>{TRQ.fail[k]=Date.now();if(!TRQ.warned){TRQ.warned=true;toast(T("trFail"),"err")}})
      .finally(()=>{TRQ.pend.delete(k);TRQ.act.delete(k);TRQ.run--;trBtnUpd();cancelAnimationFrame(TRQ.applyT);TRQ.applyT=requestAnimationFrame(trApply);trPump()})}}
function trOrig(el){const d=el.dataset;if(d.top){const D=S.days[S.cur]||{};return String(D[d.top]??"")}

  trBtnUpd()}

/* ---- Download image (PNG): same page, selected language; long reports are cut at section borders ---- */
const HTI=["https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js","https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"];
async function loadHTI(){if(window.htmlToImage)return true;

async function actSavePng(){
  if(!await loadHTI())return;const app=$("app");if(!app)return;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();

    await new Promise(r=>setTimeout(r,100));
    const W=Math.ceil(app.scrollWidth),H=Math.ceil(app.scrollHeight),pr=Math.min(2,15000/H),
          top0=app.getBoundingClientRect().top,
          cv=await htmlToImage.toCanvas(app,{pixelRatio:pr,backgroundColor:"#ffffff",skipFonts:true,width:W,height:H}),

      const blob=await new Promise(r=>c.toBlob(r,"image/png"));

    toast(T("pngDone",{n}),"ok");
